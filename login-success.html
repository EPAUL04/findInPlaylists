<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Find in Playlist</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="css/styles.css">
        <script src="js/script.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    </head>

    <body>        
        <main>
            <p>
                Now, enter information about the song. Not all fields need to be filled out; this website will submit a request to find the song based on any information provided. Click submit when finished. 
            </p>
            <br>
            <form>
                <label>Song title:</label>
                <input type="text" id="title" required="true">
                <br>
                <label>Artist(s):&nbsp; &nbsp;</label>
                <input type="text" id="artist">
                <br>
                <br>
                <label onclick="findSong()" class="submit" id="submit">submit</label>
                <!-- <button type="submit" onclick="findSong()">submit</button> -->
            </form>

            <div id="display">
                <img src="images/blank.jpg" width="100em" height="100em" alt="" id="display-image">
                <h2 id="display-title">(title)</h2>
                <h3 id="display-artists">(artist)</h3>
                <h3 id="display-album">(album)</h3>
                <p>You have added this song to the playlists: <span id="display-playlist"></span></p>
            </div>
            <br style="clear: both;">
        </main>
    </body>
</html>
